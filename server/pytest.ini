[pytest]
# The suite imports the app as `app.config`, `app.scoring` and so on, which
# needs `server/` on sys.path. `python -m pytest` puts the working directory
# there for free, so running the tests by hand has always worked — but CI runs
# a bare `pytest`, which does not, and every module importing `app` then failed
# at COLLECTION. That is worse than a normal failure: the job errors out before
# a single test runs, so the server suite has never actually run in CI since it
# was added.
pythonpath = .
